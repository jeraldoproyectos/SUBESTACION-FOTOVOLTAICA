<!DOCTYPE html>
<html lang="es">
<head>
    <title>SUBESTACION FOTOVOLTAICA - GESTOR</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-blue: #1976d2; --bg-dark: #1a1a1a; --utm-green: #00ff00; --sidebar-width: 340px; }
        
        body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; color: white; flex-direction: row; }

        /* --- DISEÑO RESPONSIVE CON FLEXBOX --- */
        #sidebar { 
            width: var(--sidebar-width); 
            background: #f4f6f8; 
            border-right: 1px solid #ddd; 
            display: flex; 
            flex-direction: column; 
            z-index: 2500; 
            color: #333; 
            transition: all 0.3s ease;
        }

        #map-container { flex-grow: 1; position: relative; height: 100%; }

        /* AJUSTES PARA MÓVIL (Pantallas menores a 768px) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { 
                width: 100%; 
                height: 35vh; /* El sidebar ocupa la parte inferior o superior */
                border-right: none;
                border-top: 2px solid var(--primary-blue);
                order: 2; /* Pone el sidebar abajo del mapa en móviles */
            }
            #map-container { height: 65vh; order: 1; }
            .ui-bottom { width: 95% !important; bottom: 10px !important; }
            .brand-logo { width: 100px !important; bottom: 80px !important; }
        }

        /* SIDEBAR INTERNALS */
        .sidebar-header { padding: 12px; background: white; border-bottom: 1px solid #ddd; text-align: center; }
        .sidebar-header h3 { margin: 0; font-size: 16px; }
        .sidebar-scroll { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .section-title { font-weight: bold; font-size: 10px; color: #888; text-transform: uppercase; margin: 10px 0 5px; letter-spacing: 1px; }

        /* CARDS ACORDEÓN */
        .feature-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        .feature-card.selected { border-left: 6px solid var(--primary-blue); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card-header { padding: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .card-title { font-weight: bold; color: #444; font-size: 12px; }
        .card-content { display: none; padding: 10px; border-top: 1px solid #f0f0f0; background: #fafafa; }
        .selected .card-content { display: block; }
        
        .utm-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; align-items: center; font-family: monospace; font-size: 10px; }
        .remove-v { color: #d32f2f; cursor: pointer; font-size: 16px; font-weight: bold; padding: 0 10px; }

        /* UI CONTROLS */
        #map { width: 100%; height: 100%; background: #111; }
        
        .ui-bottom { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 420px; z-index: 2000; 
            display: flex; flex-direction: column; gap: 5px; 
        }
        
        .utm-box { 
            background: rgba(0,0,0,0.85); color: var(--utm-green); 
            padding: 4px 10px; border-radius: 4px; text-align: center;
            font-family: monospace; font-size: 11px; border: 1px solid #444;
        }

        .slider-wrapper { 
            background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; 
            border: 1px solid #444; backdrop-filter: blur(4px);
        }
        
        .slider-controls { display: flex; align-items: center; gap: 10px; }
        .current-date-label { 
            color: var(--utm-green); font-size: 11px; font-weight: bold; 
            border: 1px solid var(--utm-green); padding: 3px 8px; border-radius: 4px; 
            min-width: 80px; text-align: center; 
        }
        input[type=range] { flex-grow: 1; accent-color: var(--utm-green); height: 25px; }

        #toolbar { 
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%); 
            z-index: 2000; display: flex; flex-direction: column; gap: 8px; 
        }
        .tool-btn { 
            width: 48px; height: 48px; background: white; border-radius: 12px; 
            border: 1px solid #ccc; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .tool-btn.active { background: var(--primary-blue); }
        .tool-btn svg { width: 24px; height: 24px; stroke: #333; fill: none; stroke-width: 2; }
        .tool-btn.active svg { stroke: white; }

        .brand-logo { position: absolute; bottom: 110px; left: 15px; z-index: 1000; width: 120px; opacity: 0.8; pointer-events: none; }
        .corner-logo { position: absolute; top: 10px; right: 10px; z-index: 1000; width: 60px; pointer-events: none; }

        /* Estilo para etiquetas de puntos */
        .point-name-label { font-weight: bold; color: #00ffff; font-size: 10px; text-shadow: 1px 1px 2px #000; pointer-events: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header"><h3>GESTIÓN DE ELEMENTOS</h3></div>
    <div class="sidebar-scroll">
        <div class="section-title">Líneas</div>
        <div id="list-line"></div>
        <div class="section-title">Áreas</div>
        <div id="list-area"></div>
        <div class="section-title">Puntos</div>
        <div id="list-point"></div>
    </div>
</div>

<div id="map-container">
    <div id="map"></div>
    <img src="logo.jpg" class="brand-logo" alt="Logo">
    <img src="pngegg.png" class="corner-logo" alt="Logo Esquina">

    <div id="toolbar">
        <button class="tool-btn" id="btn-line" title="Línea"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
        <button class="tool-btn" id="btn-area" title="Área"><svg viewBox="0 0 24 24"><path d="M4 4h10l6 6-6 6H4z"/></svg></button>
        <button class="tool-btn" id="btn-point" title="Punto"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21s-9-9-9-13a9 9 0 0118 0c0 4-9 13-9 13z"/></svg></button>
    </div>

    <div class="ui-bottom">
        <div class="utm-box" id="utm-coord">E: --- | N: ---</div>
        <div class="slider-wrapper">
            <div class="slider-controls">
                <div id="fecha-label" class="current-date-label">FECHA</div>
                <input type="range" id="smooth-slider" min="0" step="1">
            </div>
            <label style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 10px; margin-top: 8px; color: #ccc; text-transform: uppercase;">
                <input type="checkbox" id="check-fundaciones" checked> Fundaciones
            </label>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<script>
    // --- LÓGICA DE MAPA (Mantenida y optimizada) ---
    var utm19S = "+proj=utm +zone=19 +south +datum=WGS84 +units=m +no_defs";
    var wgs84 = "+proj=longlat +datum=WGS84 +no_defs";
    const toUTM = (ll) => {
        const p = proj4(wgs84, utm19S, [ll.lng, ll.lat]);
        return { x: p[0], y: p[1] };
    };

    var map = L.map('map', { zoomControl: false, minZoom: 16, maxZoom: 23 }).setView([-20.351387, -69.721985], 18);
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 23 }).addTo(map);

    map.createPane('ortofotoPane');
    map.getPane('ortofotoPane').style.zIndex = 400;
    map.createPane('planoPane');
    map.getPane('planoPane').style.zIndex = 600;

    // Capa Fundaciones
    var layerFundaciones = L.imageOverlay('fundaciones.png', [
        [-20.3507319503659, -69.7227451121303], 
        [-20.3516053052984, -69.7211073956638] 
    ], { pane: 'planoPane', opacity: 0.8 }).addTo(map);

    document.getElementById('check-fundaciones').onchange = (e) => {
        if(e.target.checked) map.addLayer(layerFundaciones);
        else map.removeLayer(layerFundaciones);
    };

    // Ortofotos
    var fechas = ["03/12/2025", "09/01/2026", "21/01/2026", "23/01/2026", "28/01/2026", "06/02/2026", "07/02/2026", "10/02/2026", "13/02/2026", "27/02/2026", "11/03/2026", "26/03/2026", "10/04/2026", "24/04/2026", "30/04/2026", "08/05/2026"];
    var folders = ["03122025", "09012026", "21012026", "23012026", "28012026", "06022026", "07022026", "10022026", "13022026", "27022026", "11032026", "26032026", "10042026", "24042026", "30042026", "08052026"];
    
    var capas = folders.map((f, i) => {
        return L.tileLayer(f + '/Z{z}/{y}/{x}.png', { maxZoom: 23, opacity: 0, pane: 'ortofotoPane' }).addTo(map);
    });

    var slider = document.getElementById('smooth-slider');
    slider.max = capas.length - 1;
    slider.value = capas.length - 1; 

    function updateView() {
        var idx = parseInt(slider.value);
        capas.forEach((c, i) => c.setOpacity(i === idx ? 1 : 0));
        document.getElementById('fecha-label').innerText = fechas[idx];
    }
    slider.oninput = updateView;
    updateView();

    // --- FUNCIONES DE DIBUJO ---
    let currentMode = null, drawingPoints = [], tempLayer = null, guideLine = null;
    let features = {}, counters = { line: 0, area: 0, point: 0 };
    let selectedId = null, editMarkers = [];

    function setMode(mode) {
        currentMode = mode;
        drawingPoints = [];
        if(tempLayer) map.removeLayer(tempLayer);
        if(guideLine) map.removeLayer(guideLine);
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        if(mode && mode !== 'add-v') document.getElementById(`btn-${mode}`).classList.add('active');
    }

    document.getElementById('btn-line').onclick = () => setMode('line');
    document.getElementById('btn-area').onclick = () => setMode('area');
    document.getElementById('btn-point').onclick = () => setMode('point');

    map.on('mousemove', (e) => {
        const utm = toUTM(e.latlng);
        document.getElementById('utm-coord').innerText = `E: ${utm.x.toFixed(2)} | N: ${utm.y.toFixed(2)}`;
        if (currentMode && drawingPoints.length > 0) {
            if (guideLine) map.removeLayer(guideLine);
            let pts = [drawingPoints[drawingPoints.length - 1], e.latlng];
            guideLine = L.polyline(pts, { color: 'white', weight: 1, dashArray: '5, 10' }).addTo(map);
        }
    });

    map.on('click', (e) => {
        if (!currentMode) return;
        if (currentMode === 'point') { createFeature('point', [e.latlng]); setMode(null); }
        else if (currentMode === 'line') {
            drawingPoints.push(e.latlng);
            if (drawingPoints.length === 2) { createFeature('line', [...drawingPoints]); setMode(null); }
        } else if (currentMode === 'area') {
            if (drawingPoints.length >= 3 && map.distance(e.latlng, drawingPoints[0]) < 10) {
                createFeature('area', [...drawingPoints]); setMode(null);
            } else {
                drawingPoints.push(e.latlng);
                if (tempLayer) map.removeLayer(tempLayer);
                tempLayer = L.polyline(drawingPoints, {color:'red', weight: 2}).addTo(map);
            }
        }
    });

    function createFeature(type, coords) {
        const id = Date.now(); counters[type]++;
        let layer, name = `${type==='line'?'LÍNEA':type==='area'?'ÁREA':'PUNTO'} ${counters[type]}`;
        if(type === 'line') layer = L.polyline(coords, {color:'red', weight:3}).addTo(map);
        else if(type === 'area') layer = L.polygon(coords, {color:'red', weight:2, fillOpacity:0.3}).addTo(map);
        else layer = L.circleMarker(coords[0], { radius: 6, color: 'red', fillColor: 'white', fillOpacity: 1 }).addTo(map);
        
        features[id] = { id, type, name, layer };
        addSidebarCard(id);
        layer.on('click', (ev) => { L.DomEvent.stopPropagation(ev); selectFeature(id); });
        selectFeature(id);
    }

    function addSidebarCard(id) {
        const f = features[id];
        const card = document.createElement('div');
        card.className = 'feature-card'; card.id = `card-${id}`;
        card.innerHTML = `
            <div class="card-header" onclick="selectFeature(${id})">
                <span class="card-title" id="title-${id}">${f.name}</span>
                <button style="color:red; border:none; background:none; font-size:10px; cursor:pointer;" onclick="deleteFeat(${id}, event)">ELIMINAR</button>
            </div>
            <div class="card-content">
                <div id="coords-${id}"></div>
            </div>`;
        document.getElementById(`list-${f.type}`).appendChild(card);
        updateCardData(id);
    }

    function updateCardData(id) {
        const f = features[id];
        let latlngs = f.type === 'point' ? [f.layer.getLatLng()] : (f.type === 'area' ? f.layer.getLatLngs()[0] : f.layer.getLatLngs());
        document.getElementById(`coords-${id}`).innerHTML = latlngs.map((ll, i) => {
            const u = toUTM(ll);
            return `<div class="utm-row">V${i+1}: E ${u.x.toFixed(2)} | N ${u.y.toFixed(2)}</div>`;
        }).join('');
    }

    function selectFeature(id) {
        if(selectedId) {
            const old = features[selectedId];
            if(old) old.layer.setStyle({color:'red', weight:2});
            document.getElementById(`card-${selectedId}`)?.classList.remove('selected');
        }
        selectedId = id;
        const f = features[id];
        f.layer.setStyle({color:'cyan', weight:4});
        document.getElementById(`card-${id}`).classList.add('selected');
    }

    function deleteFeat(id, ev) {
        ev.stopPropagation(); 
        map.removeLayer(features[id].layer);
        document.getElementById(`card-${id}`).remove();
        delete features[id];
    }
</script>

</body>
</html>
